<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Config Registry</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/i18n.js" defer></script>
  <script src="/composition.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a class="brand" href="/" aria-label="Agent Config Registry">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Agent Config Registry</span>
      </a>
      <nav class="nav" aria-label="工作区">
        <button type="button" data-view="experiments" aria-current="page">组合配置</button>
        <button type="button" data-view="assets">资产库</button>
        <button type="button" data-view="schemas">配置结构</button>
      </nav>
      <button type="button" class="button small language-switch" id="switch-language" aria-label="Switch to English" lang="en">English</button>
    </div>
  </header>
  <main id="workspace" class="workspace" aria-busy="true">
    <p class="muted">正在加载工作区…</p>
  </main>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button type="button" class="button icon" id="close-dialog" aria-label="关闭对话框">×</button>
    </div>
    <div id="dialog-content"></div>
  </dialog>
</body>
</html>
